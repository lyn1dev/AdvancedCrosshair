# Publishes a GitHub Release whenever a version tag (v*) is pushed.
#
# The release is created from the same Gradle build CI runs, so a release can
# never contain a jar that did not compile on a clean runner. Re-running the
# workflow for an existing tag updates the assets instead of failing.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.3.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      # On a tag push the tag is github.ref_name; on a manual run it comes from
      # the input, because GITHUB_REF_NAME would otherwise be the branch.
      - name: resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag}"

      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0 # --generate-notes needs the previous tags

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --stacktrace

      - name: read mod version
        id: version
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')
          echo "mod_version=${version}" >> "$GITHUB_OUTPUT"

      # The mod_version is the source of truth in the jar; the tag is only the
      # label. A mismatch is usually a forgotten bump, so surface it loudly but
      # do not block an otherwise valid release.
      - name: check tag matches mod version
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        run: |
          tag="${TAG_NAME#v}"
          case "$tag" in
            "$MOD_VERSION"|"$MOD_VERSION"-*)
              echo "Tag $TAG_NAME matches mod_version $MOD_VERSION." ;;
            *)
              echo "::warning::Tag $TAG_NAME does not match mod_version $MOD_VERSION in gradle.properties." ;;
          esac

      # Ship the remapped mod jar only, matching the existing release convention
      # (sources and the -dev jar are build by-products, not player downloads).
      - name: collect release assets
        run: |
          mkdir -p release-assets
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -exec cp {} release-assets/ \;
          test -n "$(ls -A release-assets)" || { echo "::error::No release jar found in build/libs"; exit 1; }
          ls -l release-assets

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets."
            gh release upload "$TAG_NAME" release-assets/*.jar --clobber
          else
            gh release create "$TAG_NAME" release-assets/*.jar \
              --title "$TAG_NAME" \
              --generate-notes
          fi
