# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# Built against the oldest version in the supported band (1.21.4).
# Every Minecraft member this mod touches has an identical intermediary
# name and descriptor from 1.21.4 through 1.21.11, so the remapped jar
# links against all of them.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.9
loom_version=1.9

# Mod Properties
mod_version=1.2.4
maven_group=com.example
archives_base_name=advancedcrosshair
